<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ITERUM</title>
    <link rel="stylesheet" href="/src/ui/overlay.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui">
      <header id="mark">ITERUM</header>
      <section id="caption">
        <div class="title"><span class="en"></span><span class="ja"></span></div>
        <div class="formula"></div>
      </section>
      <section id="info" hidden>
        <p class="description"></p>
      </section>
      <nav id="selector"></nav>
      <nav id="controls">
        <button id="play" type="button"></button>
 <button id="progress-toggle" type="button" title="計算の進み具合（P）" aria-label="計算の進み具合">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V12" /><path d="M10 18V7" /><path d="M15 18v-8" /><path d="M20 18V5" /></svg>
        </button>
        <button id="reset" type="button" title="視点を戻す（R）" aria-label="視点を戻す">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12a6.5 6.5 0 1 0 2.1-4.8" /><path d="M5 4.5v3.6h3.6" /></svg>
        </button>
      </nav>
      <aside id="notice"></aside>
      <aside id="toast"></aside>
      <section id="help" hidden>
        <h2>操作</h2>
        <dl></dl>
      </section>
      <pre id="debug" hidden></pre>
      <section id="progress" hidden aria-live="polite">
        <h2 class="headline"></h2>
        <div class="rows"></div>
      </section>
      <div id="progressline"><div class="fill"></div></div>
      <section id="unsupported" hidden>
        <h1>ITERUM</h1>
        <p class="reason"></p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
